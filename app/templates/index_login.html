<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>TaskFlow</title>
</head>
<body>
    <h1>TaskFlow</h1>
    <p>Seja bem vindo {{nome_de_usuario}} oque vamos fazer hoje?</p>
    <a href="/tarefa/listar">Ver suas tarefas</a>
    <a href="/perfil/visualizar">Ver perfil</a>
    {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
            <ul class="flashes">
                {% for categoria, message in messages %}
                <li class="flash-{{ categoria|lower }}">
                    {{message}}
                </li>
                {% endfor %}
            </ul>
            {% endif %}
        {% endwith %}
</html>
