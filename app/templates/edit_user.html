{% extends "base.html" %}

{% block title %}Editar perfil — TaskFlow{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2 class="card-title">Editar {{ coluna }}</h2>
    <p class="card-subtitle">Confirme com sua senha atual para alterar.</p>
    <form action="{{ url_for('usuario.editar_perfil', coluna=coluna) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="{{ coluna }}">Novo(a) {{ coluna }}</label>
            <input type="text" name="{{ coluna }}" id="{{ coluna }}" placeholder="Novo valor" required>
        </div>
        <div class="form-group">
            <label for="password1">Senha atual</label>
            <input type="password" name="password1" id="password1" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Salvar alterações</button>
    </form>
    <div class="form-footer text-center">
        <p><a href="{{ url_for('usuario.visualizar_perfil') }}" class="text-muted">← Voltar para perfil</a></p>
    </div>
</div>
{% endblock %}
