{% extends "base.html" %}

{% block title %}Entrar — TaskFlow{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2 class="card-title">Entrar</h2>
    <p class="card-subtitle">Acesse sua conta para gerenciar suas tarefas.</p>
    <form action="/auth/login" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <div class="form-footer text-center">
        <p class="text-muted">Não tem uma conta? <a href="{{ url_for('auth.cadastrar_usuario') }}">Cadastre-se</a></p>
    </div>
</div>
{% endblock %}
