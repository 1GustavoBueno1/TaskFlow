{% extends "base.html" %}

{% block title %}Sair — TaskFlow{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2 class="card-title">Sair da conta</h2>
    <p class="card-subtitle">Confirme com sua senha para sair.</p>
    <form action="{{ url_for('usuario.sair') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" name="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-danger btn-block">Sair</button>
    </form>
    <div class="form-footer text-center">
        <p><a href="/" class="text-muted">← Cancelar</a></p>
    </div>
</div>
{% endblock %}
