{% extends "base.html" %}

{% block title %}Meu perfil — TaskFlow{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2 class="card-title">Meu perfil</h2>
    <p class="card-subtitle">Suas informações pessoais.</p>
    <div class="profile-info">
        <div class="profile-row">
            <div>
                <p class="profile-row-label">Nome</p>
                <p class="profile-row-value">{{ dados_do_perfil['name'] }}</p>
            </div>
            <a href="{{ url_for('usuario.editar_perfil', coluna='name') }}" class="profile-row-edit">Editar</a>
        </div>
        <div class="profile-row">
            <div>
                <p class="profile-row-label">E-mail</p>
                <p class="profile-row-value">{{ dados_do_perfil['gmail'] }}</p>
            </div>
            <a href="{{ url_for('usuario.editar_perfil', coluna='gmail') }}" class="profile-row-edit">Editar</a>
        </div>
    </div>
</div>
{% endblock %}
