{% extends "base.html" %}

{% block title %}Cadastro — TaskFlow{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2 class="card-title">Criar conta</h2>
    <p class="card-subtitle">Comece a organizar suas tarefas em segundos.</p>
    <form action="/auth/cadastro" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
    </form>
    <div class="form-footer text-center">
        <p class="text-muted">Já tem uma conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
    </div>
</div>
{% endblock %}
