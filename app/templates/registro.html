<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Criar conta</title>
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
    </header>
    <main>
        <p>Registrar-se</p>
        <form action="/auth/cadastro", method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Nome de usuario" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Insira o E-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Insira uma senha" required>

            <button type="submit">Cadastrar-se</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
            <ul class="flashes">
                {% for categoria, message in messages %}
                <li class="flash-{{ categoria|lower }}">{{message}}</li>
                {% endfor %}
            </ul>
            {% endif %}
        {% endwith %}
        <p>Ja tem uma conta?<a href="{{url_for('auth.login')}}">Efetuar login</a></p>
    </main>
</body>
</html>
