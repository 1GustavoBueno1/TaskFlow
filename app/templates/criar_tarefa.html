{% extends "base.html" %}

{% block title %}Nova tarefa — TaskFlow{% endblock %}

{% block content %}
<div class="card card-narrow">
    <h2 class="card-title">Nova tarefa</h2>
    <p class="card-subtitle">Adicione uma tarefa à sua lista.</p>
    <form action="/tarefa/criar" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="nome">Nome da tarefa</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Estudar Flask" required>
        </div>
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" name="descrição" placeholder="Detalhes da tarefa" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar tarefa</button>
    </form>
    <div class="form-footer text-center">
        <p><a href="{{ url_for('tarefa.listar_tarefas') }}" class="text-muted">← Voltar para lista</a></p>
    </div>
</div>
{% endblock %}
